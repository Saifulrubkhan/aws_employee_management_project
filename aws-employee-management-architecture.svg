<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">AWS Serverless Employee Management Architecture</title>
  <desc id="description">User browser connects through Route 53 and CloudFront to an S3 frontend. Cognito authenticates users, API Gateway routes requests to Lambda CRUD functions, and Lambda stores employee records in DynamoDB. CloudWatch monitors the system and SNS sends alerts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px sans-serif; fill: #64748b; }
      .section { font: 700 14px sans-serif; letter-spacing: 1px; fill: #64748b; }
      .label { font: 700 16px sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 13px sans-serif; fill: #475569; text-anchor: middle; }
      .box { stroke-width: 2; rx: 12; filter: url(#shadow); }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#f8fafc"/>
  <rect x="38" y="30" width="1324" height="790" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="700" y="78" class="title" text-anchor="middle">AWS Serverless Employee Management System</text>
  <text x="700" y="106" class="subtitle" text-anchor="middle">Secure serverless CRUD application</text>

  <text x="80" y="155" class="section">FRONTEND</text>
  <text x="80" y="365" class="section">BACKEND</text>
  <text x="80" y="600" class="section">DATA AND MONITORING</text>

  <rect x="80" y="185" width="180" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="170" y="218" class="label">User Browser</text>
  <text x="170" y="242" class="small">Web app</text>

  <rect x="330" y="185" width="180" height="82" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="420" y="218" class="label">Route 53</text>
  <text x="420" y="242" class="small">DNS</text>

  <rect x="580" y="185" width="190" height="82" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="675" y="218" class="label">CloudFront</text>
  <text x="675" y="242" class="small">HTTPS delivery</text>

  <rect x="840" y="185" width="190" height="82" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="935" y="218" class="label">Amazon S3</text>
  <text x="935" y="242" class="small">Frontend files</text>

  <path d="M260 226 H330" class="arrow"/>
  <path d="M510 226 H580" class="arrow"/>
  <path d="M770 226 H840" class="arrow"/>

  <rect x="140" y="405" width="220" height="92" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="250" y="440" class="label">Amazon Cognito</text>
  <text x="250" y="464" class="small">Sign in</text>

  <rect x="470" y="405" width="230" height="92" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="585" y="440" class="label">API Gateway</text>
  <text x="585" y="464" class="small">REST API</text>

  <rect x="810" y="405" width="250" height="92" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="935" y="440" class="label">AWS Lambda</text>
  <text x="935" y="464" class="small">CRUD logic</text>

  <path d="M250 267 V350 H250 V405" class="arrow"/>
  <path d="M250 497 V535 H585 V497" class="arrow"/>
  <path d="M700 451 H810" class="arrow"/>
  <text x="730" y="434" class="small">JWT</text>
  <path d="M675 267 V325 H585 V405" class="arrow"/>
  <text x="615" y="315" class="small">Requests</text>

  <rect x="170" y="650" width="250" height="92" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="295" y="685" class="label">Amazon DynamoDB</text>
  <text x="295" y="709" class="small">Employee records</text>

  <rect x="550" y="650" width="220" height="92" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="660" y="685" class="label">AWS IAM</text>
  <text x="660" y="709" class="small">Permissions</text>

  <rect x="900" y="650" width="220" height="92" class="box" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1010" y="685" class="label">CloudWatch</text>
  <text x="1010" y="709" class="small">Logs and metrics</text>

  <rect x="1170" y="650" width="140" height="92" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1240" y="685" class="label">SNS</text>
  <text x="1240" y="709" class="small">Alerts</text>

  <path d="M935 497 V560 H295 V650" class="arrow"/>
  <text x="590" y="550" class="small">Read / write</text>
  <path d="M935 497 V585 H1010 V650" class="arrow"/>
  <text x="1045" y="575" class="small">Logs</text>
  <path d="M700 497 V620 H660 V650" class="arrow dashed"/>
  <text x="720" y="610" class="small">Permissions</text>
  <path d="M1120 696 H1170" class="arrow"/>
  <text x="1145" y="680" class="small">Alarm</text>

  <text x="700" y="790" class="subtitle" text-anchor="middle">Browser → Cognito → API Gateway → Lambda → DynamoDB</text>
</svg>
